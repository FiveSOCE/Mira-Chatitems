name: Build

on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Resolve version
        id: version
        shell: bash
        run: |
          VERSION=$(sed -n 's/^version = "\([^"]*\)"/\1/p' build.gradle.kts | head -n1)
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build
        run: gradle clean build --stacktrace

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: MiraChatItems-${{ steps.version.outputs.version }}
          path: build/libs/MiraChatItems-${{ steps.version.outputs.version }}.jar
          if-no-files-found: error

      - name: Publish release branch
        if: success() && startsWith(github.ref, 'refs/heads/release/')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="v$VERSION"
          JAR="build/libs/MiraChatItems-$VERSION.jar"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" "$JAR" \
              --target "${{ github.sha }}" \
              --title "MiraChatItems $TAG" \
              --notes "Preserves the server chat renderer while replacing MiraChatItems tokens. Prefixes, ranks, nicknames, suffixes, separators and normal chat formatting stay intact; only the linked token text in the player message is transformed."
          fi

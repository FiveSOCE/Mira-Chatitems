name: Build

on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Resolve version
        id: version
        shell: bash
        run: |
          VERSION=$(sed -n 's/^version = "\([^"]*\)"/\1/p' build.gradle.kts | head -n1)
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build
        run: gradle clean build --stacktrace

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: MiraChatItems-${{ steps.version.outputs.version }}
          path: build/libs/MiraChatItems-${{ steps.version.outputs.version }}.jar
          if-no-files-found: error

      - name: Publish release branch
        if: success() && startsWith(github.ref, 'refs/heads/release/')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="v$VERSION"
          JAR="build/libs/MiraChatItems-$VERSION.jar"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" "$JAR" \
              --target "${{ github.sha }}" \
              --title "MiraChatItems $TAG" \
              --notes "Fixes chat formatting integration properly by wrapping Paper's existing ChatRenderer instead of replacing or resending the chat line. Prefixes, ranks, nicknames, suffixes and normal chat formatting remain owned by the active chat renderer, while [item] injects a native hoverable item name and inventory/ender chest links remain clickable inside the message body."
          fi
